<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全部文章 · MyBlog</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('myblog_theme');
        var theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/article.css?v=2" />
</head>
<body class="list-page">
  <div class="page-bg"></div>

  <header class="topbar">
    <a href="index.html" class="brand" id="nav-brand">MyBlog</a>
    <a href="index.html">首页</a>
    <a href="articles.html">全部文章</a>
    <span class="spacer"></span>
    <button id="theme-toggle" class="theme-btn" type="button" title="切换到白天模式" aria-label="切换到白天模式"><span class="theme-icon" aria-hidden="true">☀</span></button>
    <a href="admin.html">⚙ 后台</a>
  </header>

  <div class="list-wrap">
    <div class="list-head">
      <h1>全部文章</h1>
      <p id="list-count">共 0 篇</p>
      <div class="tag-indicator" id="tag-indicator" hidden></div>
    </div>

    <div class="list-filters">
      <div class="cat-chips" id="cat-chips"></div>
      <input type="text" class="list-search" id="list-search" placeholder="搜索文章…" />
    </div>

    <div class="post-grid" id="post-grid">
      <div class="loading">正在加载…</div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/articles-list.js"></script>
</body>
</html>
