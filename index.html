<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">我的个人博客</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/backgrounds.css" />
</head>
<body>

  <!-- ============ 多层视差动态背景 ============ -->
  <div id="bg-stage" class="bg-stage">
    <!-- 场景 1: 星空 -->
    <div class="scene scene-1" data-scene="0">
      <div class="layer stars-far"></div>
      <div class="layer stars-mid"></div>
      <div class="layer stars-near"></div>
      <div class="layer nebula"></div>
    </div>
    <!-- 场景 2: 海洋 -->
    <div class="scene scene-2" data-scene="1">
      <div class="layer ocean-sky"></div>
      <div class="layer ocean-wave-far"></div>
      <div class="layer ocean-wave-mid"></div>
      <div class="layer ocean-wave-near"></div>
    </div>
    <!-- 场景 3: 森林 / 山川 -->
    <div class="scene scene-3" data-scene="2">
      <div class="layer forest-sky"></div>
      <div class="layer forest-mountain-far"></div>
      <div class="layer forest-mountain-mid"></div>
      <div class="layer forest-trees"></div>
    </div>
    <!-- 场景 4: 极光 -->
    <div class="scene scene-4" data-scene="3">
      <div class="layer aurora-sky"></div>
      <div class="layer aurora-1"></div>
      <div class="layer aurora-2"></div>
      <div class="layer aurora-3"></div>
    </div>
  </div>

  <!-- 鼠标粒子画布 -->
  <canvas id="particle-canvas"></canvas>

  <!-- ============ 顶部导航 ============ -->
  <header class="navbar">
    <a href="index.html" class="nav-brand" id="nav-brand" title="返回首页">MyBlog</a>
    <nav class="nav-links">
      <a href="#hero" data-nav="0">首页</a>
      <a href="#articles" data-nav="1">文章</a>
      <a href="#projects" data-nav="2">作品</a>
      <a href="#contact" data-nav="3">联系</a>
      <button id="music-toggle" class="music-btn" title="背景音乐">
        <span class="music-icon">♪</span>
      </button>
      <a href="admin.html" class="admin-link" title="后台管理">⚙</a>
    </nav>
  </header>

  <!-- ============ 主内容 ============ -->
  <main>

    <!-- 板块 1: Hero 首页 -->
    <section id="hero" class="section section-hero">
      <div class="hero-content">
        <h1 class="hero-title" id="hero-brand">MyBlog</h1>
        <p class="hero-subtitle" id="hero-subtitle">记录代码与生活的诗意瞬间</p>
        <p class="hero-typewriter"><span id="typewriter"></span><span class="cursor">|</span></p>
        <div class="hero-actions">
          <a href="#articles" class="btn btn-primary">阅读文章</a>
          <a href="#contact" class="btn btn-ghost">联系我</a>
        </div>
        <div class="scroll-hint">
          <span>向下滚动</span>
          <div class="arrow"></div>
        </div>
      </div>
    </section>

    <!-- 板块 2: 文章列表 -->
    <section id="articles" class="section section-articles">
      <div class="container">
        <div id="featured-block" hidden>
          <h2 class="section-title">精选文章</h2>
          <div class="article-grid" id="featured-grid"></div>
        </div>
        <h2 class="section-title" id="recent-heading">最近文章</h2>
        <div class="article-grid" id="article-grid">
          <!-- 由 JS 动态渲染 -->
        </div>
        <div class="articles-more" id="articles-more" style="display:none;justify-content:center;margin-top:32px;">
          <a href="articles.html" class="btn btn-ghost">查看全部文章 →</a>
        </div>
      </div>
    </section>

    <!-- 板块 3: 项目作品集 -->
    <section id="projects" class="section section-projects">
      <div class="container">
        <h2 class="section-title">项目作品</h2>
        <div class="project-grid" id="project-grid">
          <!-- 由 JS 动态渲染 -->
        </div>
      </div>
    </section>

    <!-- 板块 4: 联系 + 资料上传通道 -->
    <section id="contact" class="section section-contact">
      <div class="container">
        <h2 class="section-title">联系 & 资料通道</h2>

        <div class="contact-grid">

          <!-- 联系信息 / 留言板 -->
          <div class="card contact-card">
            <h3>联系方式</h3>
            <ul class="contact-list" id="contact-list">
              <!-- 由 JS 动态渲染 -->
            </ul>

            <h3 style="margin-top:24px;">留言板</h3>
            <form id="message-form" class="message-form">
              <input type="text" id="msg-name" placeholder="你的昵称" required maxlength="20" />
              <textarea id="msg-content" placeholder="想说点什么..." required rows="3" maxlength="500"></textarea>
              <button type="submit" class="btn btn-primary">发送留言</button>
            </form>
            <div id="message-list" class="message-list"></div>
          </div>

          <!-- 资料上传通道 -->
          <div class="card upload-card">
            <h3>资料上传通道</h3>
            <p class="upload-tip">支持任意类型文件 · 拖拽到框内或点击选择</p>

            <div id="dropzone" class="dropzone">
              <div class="dropzone-inner">
                <div class="upload-icon">⬆</div>
                <p>把文件拖到这里 或 <label for="file-input" class="file-label">点击选择</label></p>
                <input type="file" id="file-input" multiple hidden />
              </div>
            </div>

            <div class="upload-status" id="upload-status"></div>

            <h4 class="upload-list-title">已上传的文件</h4>
            <ul class="upload-list" id="upload-list">
              <!-- 由 JS 动态渲染 -->
            </ul>
          </div>

        </div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p id="footer-text">© 2026 MyBlog · Powered by 自己</p>
  </footer>

  <!-- 背景音乐（默认无音频，可在 admin 后台传入或更换） -->
  <audio id="bg-music" loop preload="none"></audio>

  <!-- 入口脚本（传统脚本，按依赖顺序加载，支持 file:// 双击直接打开） -->
  <script src="js/storage.js"></script>
  <script src="js/backgrounds.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/typewriter.js"></script>
  <script src="js/music.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
